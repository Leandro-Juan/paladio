# Contributor Development Overlay
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
services:
  db:
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    ports:
      - "127.0.0.1:6379:6379"

  valhalla:
    ports:
      - "127.0.0.1:8002:8002"

  migrate:
    image: paladio-api:dev
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: dev
    volumes:
      - ./backend:/app
      - /app/.venv
    environment:
      ENVIRONMENT: development
    command: ["sh", "-c", "chown 10001:10001 /data /custom_files /gtfs_feeds && chmod 775 /data /custom_files /gtfs_feeds && alembic upgrade head && python scripts/migrate_verified_fares_to_quotes.py"]

  api:
    image: paladio-api:dev
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: dev
    volumes:
      - ./backend:/app
      - /app/.venv
    environment:
      ENVIRONMENT: development
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "app"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    image: paladio-api:dev
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: dev
    volumes:
      - ./backend:/app
      - /app/.venv
    environment:
      ENVIRONMENT: development

  beat:
    image: paladio-api:dev
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: dev
    volumes:
      - ./backend:/app
      - /app/.venv
    environment:
      ENVIRONMENT: development

  frontend:
    image: paladio-frontend:dev
    build:
      context: ./frontend
      dockerfile: Dockerfile
