name: Paladio CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  cpp-tests:
    name: C++ Core Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libgtest-dev
      - name: Configure CMake
        run: cmake -S cpp_core -B cpp_core/build
      - name: Build C++ Core
        run: cmake --build cpp_core/build -j $(nproc)
      - name: Run CTest
        working-directory: cpp_core/build
        run: ctest --output-on-failure

  python-tests:
    name: Python Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: paladio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/paladio_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/paladio_test
      POSTGRES_HOST: 127.0.0.1
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
        working-directory: backend
      - name: Initialize PostgreSQL databases
        run: |
          python -c "
          import asyncio, asyncpg
          async def init():
              conn = await asyncpg.connect('postgresql://postgres:postgres@127.0.0.1:5432/postgres')
              for db in ['paladio', 'paladio_test']:
                  exists = await conn.fetchval('SELECT 1 FROM pg_database WHERE datname = \$1', db)
                  if not exists:
                      await conn.execute(f'CREATE DATABASE {db}')
              await conn.close()
          asyncio.run(init())
          "
      - name: Run Pytest
        run: pytest backend/tests cpp_core/tests --maxfail=5

  frontend-tests:
    name: Frontend Playwright Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright Browsers
        working-directory: frontend
        run: npx playwright install --with-deps
      - name: Run Component Tests
        working-directory: frontend
        run: npm run test:ct
      - name: Run E2E Tests
        working-directory: frontend
        run: npm run test:e2e
