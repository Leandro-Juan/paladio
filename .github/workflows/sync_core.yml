name: Sync C++ Core to Independent Repo

on:
  push:
    branches:
      - main
    paths:
      - 'cpp_core/**'
  workflow_dispatch: # Allow manually triggering the sync when needed

permissions:
  contents: read

jobs:
  sync-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Paladio repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Push cpp_core to paladio-core
        uses: s0/git-publish-subdir-action@ac113f6bfe8896e85a373534242c949a7ea74c98 # develop
        env:
          REPO: git@github.com:Leandro-Juan/paladio-core.git
          BRANCH: main
          FOLDER: cpp_core
          SSH_PRIVATE_KEY: ${{ secrets.CORE_DEPLOY_KEY }}
          SKIP_EMPTY_COMMITS: true