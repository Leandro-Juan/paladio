version: 2
updates:
  # Automated version bumps are paused (open-pull-requests-limit: 0)
  # to prevent untested bot PRs from breaking delicate Playwright, Next.js, and C++ toolchains.
  # Security advisory fixes remain active via GitHub Security Alerts.

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0

  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
