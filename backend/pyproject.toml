[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "paladio-gateway"
version = "1.0.0"
description = "Semantic Gateway for the Continuous Sovereign Travel Optimization Engine"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "websockets>=12.0",
    "pydantic>=2.5.3",
    "pydantic-settings>=2.1.0",
    "pydantic-ai>=0.0.12",
    "langchain>=1.0.0",
    "langchain-core>=1.0.0",
    "langchain-postgres>=0.0.9",
    "langchain-ollama>=0.1.1",
    "langgraph>=0.0.26",
    "langsmith>=0.3.0",
    "sqlalchemy[asyncio]>=2.0.25",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.1.0",
    "pgvector>=0.2.4",
    "redis>=5.0.1",
    "celery>=5.3.6",
    "httpx>=0.26.0",
    "playwright>=1.41.0",
    "alembic>=1.13.0",
    "docker>=7.0.0",
    "duffel-api>=0.6.0",
    "fast-flights>=1.0.0",
    "amadeus>=10.0.0",
    "jax>=0.4.0",
    "jaxlib>=0.4.0",
    "flax>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --asyncio-mode=auto"
testpaths = [
    "tests",
]
python_files = ["test_*.py"]
