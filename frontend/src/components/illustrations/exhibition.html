<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vector Artwork Exhibition</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>

    :root {
      --color-accent-coral: #D42A2F;
      --color-accent-teal-mid: #1B8FA6;
      --color-accent-teal-soft: #7CC4D1;
      --color-accent-teal-deep: #0F4C5C;
      --color-accent-gold: #E2B33C;
      --color-border: #E2D9CC;
      --color-surface-card: #FAF6F0;
    }
    .dark {
      --color-accent-coral: #EF4D53;
      --color-accent-teal-mid: #25ADC8;
      --color-accent-teal-soft: #85D7E5;
      --color-accent-teal-deep: #0A3642;
      --color-accent-gold: #F0C454;
      --color-border: #234654;
      --color-surface-card: #132A33;
    }
  </style>
</head>
<body class="bg-transparent text-[var(--foreground)] antialiased p-4 font-sans">
  <div class="max-w-6xl mx-auto space-y-6">

    <!-- Top Header Card -->
    <div class="bg-[var(--card)] border border-[var(--border)] rounded-2xl p-6 shadow-sm">
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
        <div>
          <span class="text-xs font-mono font-bold tracking-wider uppercase text-[#1B8FA6] block mb-1">
            // Standalone Vector Exhibition
          </span>
          <h1 class="text-2xl font-semibold tracking-tight text-[var(--foreground)]">
            Refined Minimalist & Tactical Illustration Gallery
          </h1>
          <p class="text-sm text-[var(--muted-foreground)] mt-1 max-w-xl">
            28 custom SVG illustrations with authentic Japanese minimalist geometry, origami folds, celestial astrometry, and tactical telemetry. Completely decoupled from application code.
          </p>
        </div>

        <!-- Scale Controls -->
        <div class="flex items-center gap-2 bg-[var(--background)] border border-[var(--border)] p-1.5 rounded-xl self-start md:self-auto">
          <span class="text-xs font-mono text-[var(--muted-foreground)] px-2 font-medium">Scale:</span>
          <button onclick="setScale(90)" class="scale-btn text-xs font-mono px-3 py-1 rounded-lg border border-transparent hover:border-[var(--border)] transition">90px</button>
          <button onclick="setScale(120)" class="scale-btn active text-xs font-mono px-3 py-1 rounded-lg bg-[#0F4C5C] text-white font-semibold transition">120px</button>
          <button onclick="setScale(150)" class="scale-btn text-xs font-mono px-3 py-1 rounded-lg border border-transparent hover:border-[var(--border)] transition">150px</button>
        </div>
      </div>

      <!-- Categories & Search -->
      <div class="flex flex-wrap items-center justify-between gap-3 mt-6 pt-5 border-t border-[var(--border)]">
        <div class="flex flex-wrap gap-1.5" id="categoryPills">
          <button onclick="setCategory('All')" class="cat-pill active text-xs font-medium px-3.5 py-1.5 rounded-full bg-[#0F4C5C] text-white transition">All (28)</button>
          <button onclick="setCategory('Refined Focus')" class="cat-pill text-xs font-medium px-3.5 py-1.5 rounded-full bg-[var(--background)] hover:bg-[var(--border)] text-[#D42A2F] font-semibold border border-[#D42A2F]/30 transition">✨ Newly Refined (4)</button>
          <button onclick="setCategory('Transit & Waypoints')" class="cat-pill text-xs font-medium px-3.5 py-1.5 rounded-full bg-[var(--background)] hover:bg-[var(--border)] text-[var(--muted-foreground)] transition">Transit</button>
          <button onclick="setCategory('Hospitality & Leisure')" class="cat-pill text-xs font-medium px-3.5 py-1.5 rounded-full bg-[var(--background)] hover:bg-[var(--border)] text-[var(--muted-foreground)] transition">Hospitality</button>
          <button onclick="setCategory('Culture & Sights')" class="cat-pill text-xs font-medium px-3.5 py-1.5 rounded-full bg-[var(--background)] hover:bg-[var(--border)] text-[var(--muted-foreground)] transition">Culture</button>
          <button onclick="setCategory('Navigation')" class="cat-pill text-xs font-medium px-3.5 py-1.5 rounded-full bg-[var(--background)] hover:bg-[var(--border)] text-[var(--muted-foreground)] transition">Navigation</button>
          <button onclick="setCategory('Tactical & Protocol')" class="cat-pill text-xs font-medium px-3.5 py-1.5 rounded-full bg-[var(--background)] hover:bg-[var(--border)] text-[var(--muted-foreground)] transition">Tactical</button>
        </div>

        <div class="relative w-full sm:w-64">
          <input
            type="text"
            id="searchInput"
            oninput="handleSearch()"
            placeholder="Search illustrations..."
            class="w-full text-xs bg-[var(--background)] text-[var(--foreground)] border border-[var(--border)] rounded-full pl-8 pr-4 py-1.5 outline-none focus:border-[#1B8FA6] transition"
          />
          <span class="absolute left-2.5 top-1/2 -translate-y-1/2 text-xs text-[var(--muted-foreground)]">🔍</span>
        </div>
      </div>
    </div>

    <!-- Gallery Grid -->
    <div id="galleryGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
      <!-- Dynamic cards rendered below -->
    </div>
  </div>

    function renderGrid() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const grid = document.getElementById('galleryGrid');

      const filtered = ITEMS.filter(item => {
        let matchesCat = false;
        if (currentCategory === 'All') matchesCat = true;
        else if (currentCategory === 'Refined Focus') matchesCat = !!item.isRefined;
        else matchesCat = item.category === currentCategory;

        if (!matchesCat) return false;
        if (!q) return true;
        return item.title.toLowerCase().includes(q) ||
               item.desc.toLowerCase().includes(q) ||
               item.tags.some(t => t.toLowerCase().includes(q));
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center py-12 text-sm text-[var(--muted-foreground)]">No illustrations match your filter.</div>`;

          .replace(/height="80"/, `height="${Math.round(currentScale * (80/120))}"`);

        return `
          <div class="bg-[var(--card)] border ${item.isRefined ? 'border-[#1B8FA6] ring-1 ring-[#1B8FA6]/20' : 'border-[var(--border)]'} border-dashed rounded-xl p-4 flex flex-col justify-between shadow-sm hover:border-[#1B8FA6] transition relative">
            ${item.isRefined ? '<span class="absolute top-2 right-2 text-[9px] font-mono px-2 py-0.5 rounded-full bg-[#D42A2F]/10 text-[#D42A2F] font-bold border border-[#D42A2F]/20">REFINED</span>' : ''}
            <div>
              <div class="bg-[var(--background)] border border-[var(--border)] rounded-lg p-3 mb-3 flex items-center justify-center min-h-[110px]">
                ${scaledSvg}
              </div>
              <div class="flex items-center justify-between text-[10px] font-mono mb-1">
                <span class="text-[#1B8FA6] font-bold uppercase tracking-wide">${item.category.split(' ')[0]}</span>
                <span class="text-[var(--muted-foreground)]">120×80</span>
              </div>
              <h3 class="font-semibold text-sm text-[var(--foreground)] mb-1 leading-tight">${item.title}</h3>
              <p class="text-xs text-[var(--muted-foreground)] leading-normal mb-3">${item.desc}</p>
            </div>
            <button
              onclick="copySvg('${item.id}', this)"
              class="w-full text-xs font-mono font-medium py-1.5 px-3 rounded-lg border border-[var(--border)] bg-[var(--background)] hover:bg-[#0F4C5C] hover:text-white transition text-center"
            >
              Copy SVG
            </button>
          </div>
        `;
      }).join('');
    }

    function setCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('#categoryPills .cat-pill').forEach(btn => {
        const isMatch = btn.textContent.includes(cat) || (cat === 'All' && btn.textContent.includes('All'));
        btn.classList.toggle('active', isMatch);
        btn.classList.toggle('bg-[#0F4C5C]', isMatch && cat !== 'Refined Focus');
        btn.classList.toggle('bg-[#D42A2F]', isMatch && cat === 'Refined Focus');
        btn.classList.toggle('text-white', isMatch);
        btn.classList.toggle('bg-[var(--background)]', !isMatch);
        btn.classList.toggle('text-[var(--muted-foreground)]', !isMatch && cat !== 'Refined Focus');
      });
      renderGrid();
    }

    function setScale(s) {
      currentScale = s;
      document.querySelectorAll('.scale-btn').forEach(btn => {
        const isMatch = btn.textContent === s + 'px';
        btn.classList.toggle('active', isMatch);
        btn.classList.toggle('bg-[#0F4C5C]', isMatch);
        btn.classList.toggle('text-white', isMatch);
        btn.classList.toggle('font-semibold', isMatch);
      });
      renderGrid();
    }

    function handleSearch() {
      renderGrid();
    }

    function copySvg(id, btn) {
      const item = ITEMS.find(x => x.id === id);
      if (!item) return;
      navigator.clipboard.writeText(item.svg).then(() => {
        const prev = btn.textContent;
        btn.textContent = 'Copied!';
        btn.classList.add('bg-emerald-600', 'text-white', 'border-emerald-600');
        setTimeout(() => {
          btn.textContent = prev;
          btn.classList.remove('bg-emerald-600', 'text-white', 'border-emerald-600');
        }, 1500);
      });
    }

    renderGrid();
  </script>
</body>
</html>
