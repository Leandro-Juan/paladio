repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.1
    hooks:
      - id: ruff
        args: [ --fix ]
      - id: ruff-format
  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: bash -c 'cd frontend && files=() && for f in "$@"; do files+=("${f#frontend/}"); done && NODE_OPTIONS="--max-old-space-size=2048" npx eslint --no-warn-ignored "${files[@]}"' _
        language: system
        files: ^frontend/.*\.[jt]sx?$
        pass_filenames: true
      - id: protect-demo-branch
        name: Protect demo branch from accidental commits
        entry: scripts/guard_demo_branch.sh
        language: script
        always_run: true
        pass_filenames: false
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.3
    hooks:
      - id: clang-format
        types_or: [c++, c]
