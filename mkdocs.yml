      - "Quickstart: First Trip": getting-started/quickstart.md
      - "Local Development": getting-started/local-development.md
  - User Guide:
      - "Control Center & Taste Star": user-guide/control-center-and-taste.md
      - "Creating Trips (/engine)": user-guide/trip-creation.md
      - "Trip Workspace & Speed Dial": user-guide/trip-workspace.md
      - "Public Transit & Valhalla": user-guide/public-transit-and-routing.md
      - "Bookings Wallet & Passes": user-guide/bookings-wallet.md
      - "Route Monitoring & Deals": user-guide/route-monitoring-and-deals.md
      - "Costs & Group Splitting": user-guide/costs-and-group-splitting.md
      - "Trip Archive, Photos & Sharing": user-guide/vault-photos-and-sharing.md
      - "AI Travel Assistant": user-guide/ai-travel-assistant.md
  - Self-Hosting:
      - "Configuration & Env Vars": self-hosting/configuration.md
      - "City POIs, Maps & GTFS": self-hosting/city-data-and-gtfs.md
      - "LLM Providers & MCP Clients": self-hosting/llm-providers-and-mcp.md
      - "Photo Sync, Relays & Secrets": self-hosting/integrations-and-vault.md
      - "Reverse Proxy & Security": self-hosting/reverse-proxy-and-security.md
      - "Backups, Updates & Troubleshooting": self-hosting/backups-updates-and-troubleshooting.md
  - Architecture:
      - "System Overview": architecture/system-overview.md
      - "Deterministic Trip Engine": architecture/deterministic-trip-engine.md
      - "C++20 Combinatorial Core": architecture/cpp-combinatorial-core.md
      - "Semantic RAG & Taste Learning": architecture/semantic-rag-and-taste-learning.md
      - "Deal Engine & Multi-Modal Transit": architecture/deal-engine-and-transit.md
      - "Agent & MCP Safety Model": architecture/agent-and-mcp-safety.md
      - "Frontend, PWA & Demo Mode": architecture/frontend-and-demo-mode.md
  - Reference:
