[pytest]
minversion = 8.0
addopts = -ra -q --asyncio-mode=auto -m "not slow and not live_integration"
markers =
    slow: marks tests as slow (deselected by default, run with -m slow)
    live_integration: marks tests requiring external live APIs, network downloads, or heavy compilation (run with -m live_integration)
pythonpath = backend
testpaths = backend/tests
