services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: dev
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/.venv
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/paladio
      - POSTGRES_HOST=db
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_BASE_URL=http://llm:11434
      - VALIDATOR_MODEL=ollama:qwen2.5
      - VALHALLA_URL=http://valhalla:8002
      - NODE_ENV=development
      - AVIATIONSTACK_API_KEY=${AVIATIONSTACK_API_KEY}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started
    security_opt:
      - no-new-privileges:true

  db:
    image: timescale/timescaledb:latest-pg16
    ports:
      - "127.0.0.1:5432:5432" # Exposed only to localhost for admin, tailscale
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: paladio
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    security_opt:
      - no-new-privileges:true

  llm:
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:11435:11434"
    volumes:
      - ollamadata:/root/.ollama
    security_opt:
      - no-new-privileges:true

  init-llm:
    image: ollama/ollama:latest
    depends_on:
      llm:
        condition: service_started
    environment:
      - OLLAMA_HOST=http://llm:11434
    entrypoint: /bin/sh
    command: -c "sleep 5 && ollama pull qwen2.5 && ollama pull nomic-embed-text"

  valhalla:
    image: ghcr.io/gis-ops/docker-valhalla/valhalla:latest
    ports:
      - "127.0.0.1:8002:8002"
    volumes:
      - valhalladata:/custom_files
    environment:
      - serve_rst=True
      - use_tiles_ignore_pbf=False
      - force_rebuild=True
      - build_elevation=False
      - build_transit=True
      
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: dev
    volumes:
      - ./backend:/app
      - /app/.venv
      - /var/run/docker.sock:/var/run/docker.sock
      - valhalladata:/custom_files
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/paladio
      - POSTGRES_HOST=db
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_BASE_URL=http://llm:11434
      - VALIDATOR_MODEL=ollama:qwen2.5
      - NODE_ENV=development
      - AVIATIONSTACK_API_KEY=${AVIATIONSTACK_API_KEY}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: celery -A app.celery_app worker --loglevel=info
    security_opt:
      - no-new-privileges:true

  beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: dev
    volumes:
      - ./backend:/app
      - /app/.venv
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/paladio
      - POSTGRES_HOST=db
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_BASE_URL=http://llm:11434
      - VALIDATOR_MODEL=ollama:qwen2.5
      - NODE_ENV=development
      - AVIATIONSTACK_API_KEY=${AVIATIONSTACK_API_KEY}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: celery -A app.celery_app beat --loglevel=info
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata:
  redisdata:
  ollamadata:
  valhalladata:
