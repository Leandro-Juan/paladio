services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: dev
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - /app/.venv
      - valhalladata:/custom_files
      - gtfsdata:/gtfs_feeds
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-paladio}
      - POSTGRES_HOST=db
      - REDIS_URL=redis://redis:6379/0
      - FASTEMBED_CACHE_PATH=/opt/models/fastembed
      - FASTEMBED_THREADS=2
      - VALHALLA_URL=http://valhalla:8002
      - NODE_ENV=development
    env_file:
      - path: .env
        required: false
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app
    mem_limit: 2048m
    mem_reservation: 512m
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_started
    security_opt:
      - no-new-privileges:true

  db:
    image: timescale/timescaledb:latest-pg16
    ports:
      - "127.0.0.1:5432:5432" # Exposed only to localhost for admin, tailscale
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-paladio}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    security_opt:
      - no-new-privileges:true

  valhalla:
    image: ghcr.io/gis-ops/docker-valhalla/valhalla:latest
    restart: unless-stopped
    shm_size: 512m
    mem_limit: 3072m
    mem_reservation: 1024m
    cpus: 2.0
    ports:
      - "127.0.0.1:8002:8002"
    volumes:
      - valhalladata:/custom_files
      - gtfsdata:/gtfs_feeds
    environment:
      - serve_rst=True
      - server_threads=2
      - use_tiles_ignore_pbf=True
      - force_rebuild=False
      - build_elevation=False
      - build_transit=False
      
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: dev
    mem_limit: 2048m
    mem_reservation: 512m
    volumes:
      - ./backend:/app
      - /app/.venv
      - valhalladata:/custom_files
      - gtfsdata:/gtfs_feeds
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-paladio}
      - POSTGRES_HOST=db
      - REDIS_URL=redis://redis:6379/0
      - FASTEMBED_CACHE_PATH=/opt/models/fastembed
      - FASTEMBED_THREADS=2
      - NODE_ENV=development
    env_file:
      - path: .env
        required: false
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: celery -A app.celery_app worker --loglevel=info -Q celery,transit_build,poi_hydration -c 2 --prefetch-multiplier=1 --max-memory-per-child=350000 --max-tasks-per-child=50
    security_opt:
      - no-new-privileges:true

  beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: dev
    mem_limit: 512m
    mem_reservation: 128m
    volumes:
      - ./backend:/app
      - /app/.venv
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-paladio}
      - POSTGRES_HOST=db
      - REDIS_URL=redis://redis:6379/0
      - NODE_ENV=development
    env_file:
      - path: .env
        required: false
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: celery -A app.celery_app beat --loglevel=info
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata:
  redisdata:
  valhalladata:
  gtfsdata:
